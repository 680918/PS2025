name: Agent Benchmark

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  agent-benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run agent benchmark quality gate
        run: |
          python -m evaluation.agent_evaluation_benchmark_cli \
            --baseline evaluation/baselines/agent_benchmark_baseline.json
