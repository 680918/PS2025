<main id="main-content" class="verification-layout">
    <section class="verification-card" aria-labelledby="registration-waiting-title">
        <div class="verification-topline"><span class="card-mark" aria-hidden="true">知</span><span class="verification-step">注册流程预览</span></div>
        <span class="verification-symbol" aria-hidden="true">信</span>
        <p class="eyebrow">YOUR NEXT STEP</p>
        <h1 id="registration-waiting-title">下一步，验证你的邮箱</h1>
        <p class="verification-description">填写内容已通过检查。正式注册时，将通过验证邮件确认这个邮箱属于你。</p>
        <p class="registration-email">你的邮箱：<strong>$masked_email</strong></p>
        <ol class="registration-progress" aria-label="注册步骤">
            <li><span class="progress-done" aria-hidden="true">✓</span><div><strong>填写检查已完成</strong><p>邮箱格式与密码长度符合要求</p></div></li>
            <li aria-current="step"><span aria-hidden="true">2</span><div><strong>准备验证邮箱</strong><p>本次尚未发送邮件，也未创建账户</p></div></li>
            <li><span aria-hidden="true">3</span><div><strong>验证后完成账户创建</strong><p>接着开启自己的成长空间</p></div></li>
        </ol>
        <div class="registration-preview-note" role="status">当前为流程预览，只完成填写检查。邮箱和密码没有保存，无需等待邮件。</div>
        <a class="button button-outline button-full" href="/web/register">返回注册页</a>
        <a class="back-link" href="/">← 返回首页</a>
    </section>
    <p class="verification-caption">每一段成长，都有自己的开始。</p>
</main>
