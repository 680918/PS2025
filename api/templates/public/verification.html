<main id="main-content" class="verification-layout">
    <section class="verification-card" aria-labelledby="verification-title">
        <div class="verification-topline"><span class="card-mark" aria-hidden="true">知</span><span class="verification-step">$step_label</span></div>
        <span class="verification-symbol" aria-hidden="true">$symbol</span>
        <p class="eyebrow">$eyebrow</p>
        <h1 id="verification-title">$heading</h1>
        <p class="verification-description">$description</p>
        $action
        <div class="verification-help"><p>$help</p></div>
        <a class="back-link" href="/">← 返回首页</a>
    </section>
    <p class="verification-caption">每一段成长，都有自己的开始。</p>
</main>
