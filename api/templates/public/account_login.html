<main id="main-content" class="auth-layout">
    <section class="auth-story" aria-labelledby="login-story-title">
        <p class="eyebrow"><span class="small-line" aria-hidden="true"></span>WELCOME BACK</p>
        <h1 id="login-story-title">欢迎回来。<br>接着自己的节奏走。</h1>
        <p class="auth-description">用邮箱和密码，回到属于自己的成长空间。</p>
        <ul class="story-list"><li>从一次好奇，开始新的理解</li><li>把每次学习，留成自己的积累</li><li>按自己的节奏，一点一点成长</li></ul>
        <p class="story-footnote">从上次的对话继续，让每次学习都有积累。</p>
    </section>
    <section class="auth-card" aria-labelledby="login-title">
        <span class="card-mark" aria-hidden="true">知</span>
        <h2 id="login-title">登录知行</h2>
        <p class="auth-intro">还没有账户？<a class="text-link" href="/web/register">创建账户</a></p>
        $error
        <form method="post" action="/web/auth/login" aria-describedby="login-help">
            <input type="hidden" name="csrf" value="$csrf">
            <fieldset>
            <legend class="visually-hidden">邮箱与密码登录</legend>
            <label for="login-email">邮箱</label>
            <input id="login-email" type="email" name="email" value="$email" autocomplete="username" placeholder="注册时使用的邮箱" maxlength="254" required>
            <label for="login-password">密码</label>
            <input id="login-password" type="password" name="password" autocomplete="current-password" placeholder="输入密码" maxlength="128" required>
            <button class="button button-primary button-full" type="submit">登录我的成长空间 →</button>
            </fieldset>
        </form>
        <p id="login-help" class="availability-note">请先完成邮箱验证。登录状态最长保留 8 小时，可随时主动退出。</p>
        <p class="account-help"><a class="text-link" href="/web/forgot-password">忘记密码？通过邮箱找回</a></p>
        <a class="back-link" href="/">← 返回首页</a>
    </section>
</main>
