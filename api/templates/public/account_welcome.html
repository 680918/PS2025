<main id="main-content" class="account-space">
    <section class="account-greeting" aria-labelledby="welcome-title">
        <div><p class="eyebrow">YOUR GROWTH SPACE</p><h1 id="welcome-title">欢迎回来，$name。</h1><p>不用急着完成什么，从今天的一个想法开始。</p><p class="account-status">邮箱已验证 · $email</p></div>
        <form method="post" action="/web/auth/logout"><input type="hidden" name="csrf" value="$csrf"><button class="button button-outline" type="submit">退出登录</button></form>
    </section>
    <div class="coach-workspace">
        <aside class="workspace-sidebar" aria-label="成长空间导航">
            <p class="workspace-nav-title">我的空间</p>
            <nav class="workspace-nav" aria-label="工作区入口">
                <a class="workspace-nav-item workspace-nav-current" href="#coach-dialog" aria-current="location">对话</a>
                <button class="workspace-nav-item" type="button" disabled>知识库</button>
                <button class="workspace-nav-item" type="button" disabled>资料与书籍</button>
            </nav>
            <p class="workspace-sidebar-caption">资料提供讨论依据。<br>知识库留住整理后的成果。</p>
        </aside>
        <section id="coach-dialog" class="workspace-conversation" aria-label="和成长教练对话">
            $dialogue_body
        </section>
        <aside class="workspace-learning" aria-label="学习位置与引用资料">$learning_panel</aside>
    </div>
    <p class="account-space-footnote">一个持续交流的地方，一份不断积累的个人知识库。</p>
</main>
